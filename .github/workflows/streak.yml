name: Update GitHub Streak

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub Streak
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}

          output-path: profile/streak.svg

          background: 0B0714
          stroke: 151025
          ring: D89BFF
          fire: D89BFF

          currStreakNum: C8B6E8
          sideNums: C8B6E8

          currStreakLabel: C8B6E8
          sideLabels: C8B6E8

          dates: 8B6BB1

          hide-border: true

      - name: Commit Streak Card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          git commit -m "Update GitHub streak" || exit 0

          git push
